<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffdc5e" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#ff9900" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>

    <!-- Silver Blackout Glow -->
    <radialGradient id="silverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Midnight Squircle Badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Light Cluster of Ukraine -->
  <g transform="translate(14, 28) scale(0.78)">
    <!-- Simplified National Map Path with Ambient Glow -->
    <!-- West / Carpathians (Glowing Gold) -->
    <circle cx="20" cy="50" r="18" fill="url(#goldGlow)" />
    <circle cx="28" cy="42" r="12" fill="url(#goldGlow)" />
    <circle cx="15" cy="48" r="8" fill="url(#goldGlow)" />
    
    <!-- Kyiv & North-Central (Mix of Gold & Silver) -->
    <circle cx="56" cy="28" r="14" fill="url(#goldGlow)" />
    <circle cx="48" cy="38" r="9" fill="url(#goldGlow)" />
    <circle cx="68" cy="32" r="8" fill="url(#goldGlow)" />

    <!-- South / Odesa (Glowing Gold) -->
    <circle cx="52" cy="72" r="13" fill="url(#goldGlow)" />
    <circle cx="44" cy="80" r="7" fill="url(#goldGlow)" />

    <!-- East / Kharkiv / Dnipro (Gold & Silver nodes) -->
    <circle cx="92" cy="35" r="12" fill="url(#goldGlow)" />
    <circle cx="82" cy="52" r="11" fill="url(#goldGlow)" />
    <circle cx="106" cy="50" r="9" fill="url(#goldGlow)" />

    <!-- Constellation of Star Points (Warm Golden Sparks) -->
    <circle cx="16" cy="42" r="2.2" fill="#fff" />
    <circle cx="24" cy="36" r="2.0" fill="#ffec8b" />
    <circle cx="22" cy="54" r="2.5" fill="#fff" />
    <circle cx="32" cy="48" r="2.2" fill="#ffd000" />
    <circle cx="36" cy="32" r="1.8" fill="#ffd000" />
    <circle cx="44" cy="40" r="2.0" fill="#fff" />
    <circle cx="54" cy="26" r="3.2" fill="#fff" />
    <circle cx="58" cy="36" r="2.4" fill="#ffd000" />
    <circle cx="48" cy="62" r="2.2" fill="#ffd000" />
    <circle cx="52" cy="74" r="3.0" fill="#fff" />
    <circle cx="64" cy="55" r="2.0" fill="#ffd000" />
    <circle cx="76" cy="46" r="2.2" fill="#ffd000" />
    <circle cx="82" cy="52" r="2.8" fill="#fff" />
    <circle cx="92" cy="34" r="3.0" fill="#fff" />
    <circle cx="100" cy="42" r="2.2" fill="#ffd000" />
    <circle cx="106" cy="50" r="2.5" fill="#fff" />
    <circle cx="86" cy="68" r="2.2" fill="#ffd000" />

    <!-- Blackout Dormant Nodes (Graphite Core + Silver Edge) -->
    <circle cx="64" cy="22" r="4.2" fill="#18202f" stroke="#f8fafc" stroke-width="1.3" />
    <circle cx="64" cy="22" r="1.0" fill="#cbd5e1" />

    <circle cx="74" cy="28" r="3.5" fill="#18202f" stroke="#e2e8f0" stroke-width="1.1" />
    <circle cx="40" cy="24" r="3.0" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.0" />
    <circle cx="68" cy="44" r="3.6" fill="#18202f" stroke="#f8fafc" stroke-width="1.2" />
    <circle cx="88" cy="46" r="3.2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.1" />
    <circle cx="78" cy="62" r="3.8" fill="#18202f" stroke="#f8fafc" stroke-width="1.2" />
    <circle cx="98" cy="58" r="3.2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.0" />
    <circle cx="36" cy="64" r="2.8" fill="#1e293b" stroke="#cbd5e1" stroke-width="0.9" />
  </g>
</svg>
